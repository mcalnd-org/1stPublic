name: STAGES

on:
  push:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Select a stage to run'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - DEV_STAGES
          - PRD_STAGES

jobs:
  DEV_BUILD_STAGE:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.stage == 'ALL' || github.event.inputs.stage == 'DEV_STAGES' }}
    steps:
      - run: echo "DEV BUILD"
      - run: sleep 10

  DEV_DEPLOY_STAGE:
    runs-on: ubuntu-latest
    needs: DEV_BUILD_STAGE
    if: ${{ github.event_name == 'push' || github.event.inputs.stage == 'ALL' || github.event.inputs.stage == 'DEV_STAGES' }}
    steps:
      - run: echo "DEV DEPLOY"
      - run: sleep 10

  PRD_BUILD_STAGE:
    runs-on: ubuntu-latest
    environment: prd
    if: ${{ github.event_name == 'push' || github.event.inputs.stage == 'ALL' || github.event.inputs.stage == 'PRD_STAGES' }}
    steps:
      - run: echo "PRD BUILD"
      - run: sleep 10

  PRD_DEPLOY_STAGE:
    runs-on: ubuntu-latest
    environment: prd
    needs: PRD_BUILD_STAGE
    if: ${{ github.event_name == 'push' || github.event.inputs.stage == 'ALL' || github.event.inputs.stage == 'PRD_STAGES' }}
    steps:
      - run: echo "PRD DEPLOY"
